apiVersion: sloeval.dev/v1alpha1
kind: AISLO
metadata:
  name: agent-client
spec:
  service: planner
  selector:
    matchLabels:
      gen_ai_agent_name: planner
  slos:
    - name: remote-agent
      objective: 99
      sli:
        latency: {stage: end_to_end, target: agent, source: client, threshold: 20.48s}
