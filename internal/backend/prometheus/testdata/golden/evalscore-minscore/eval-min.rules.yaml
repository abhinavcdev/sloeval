    rules:
      - alert: ChatHelpfulErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="eval-min/helpful"} > (14.4 * 0.1) and sloe:sli_error:ratio_rate5m{sloe_id="eval-min/helpful"} > (14.4 * 0.1))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="eval-min/helpful"} > (6 * 0.1) and sloe:sli_error:ratio_rate30m{sloe_id="eval-min/helpful"} > (6 * 0.1))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 90% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: chat / helpful is burning its error budget too fast (page)
      - alert: ChatHelpfulErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="eval-min/helpful"} > (3 * 0.1) and sloe:sli_error:ratio_rate2h{sloe_id="eval-min/helpful"} > (3 * 0.1))
