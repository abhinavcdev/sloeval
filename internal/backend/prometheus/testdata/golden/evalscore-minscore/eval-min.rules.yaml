          (sloe:sli_error:ratio_rate3d{sloe_id="eval-min/helpful"} > (1 * 0.1) and sloe:sli_error:ratio_rate6h{sloe_id="eval-min/helpful"} > (1 * 0.1))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 90% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: chat / helpful is burning its error budget too fast (ticket)
