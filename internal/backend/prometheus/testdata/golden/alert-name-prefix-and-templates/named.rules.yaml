  - name: sloe:named/errors:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="named/errors"}[30d])
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:objective:ratio
        expr: vector(0.99)
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget:ratio
        expr: vector(0.01)
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="named/errors"} / 0.01)
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="named/errors"} / 0.01
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="named/errors"} / 0.01
        labels:
          sloe_id: named/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: named/errors
          sloe_objective: "99"
          sloe_service: chat
          sloe_sli_kind: errorRatio
          sloe_slo: errors
          sloe_window: 30d
          team: ml
  - name: sloe:named/errors:alerts
    rules:
      - alert: ChatModelErrors
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="named/errors"} > (14.4 * 0.01) and sloe:sli_error:ratio_rate5m{sloe_id="named/errors"} > (14.4 * 0.01))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="named/errors"} > (6 * 0.01) and sloe:sli_error:ratio_rate30m{sloe_id="named/errors"} > (6 * 0.01))
        labels:
          sloe_severity: page
          team: ml-oncall
        annotations:
          dashboard: https://grafana.example.com/d/chat?var-slo={{ $labels.sloe_slo }}
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          runbook_url: https://runbooks.example.com/chat
          summary: chat / errors is burning its error budget too fast (page)
      - alert: ChatModelErrors
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="named/errors"} > (3 * 0.01) and sloe:sli_error:ratio_rate2h{sloe_id="named/errors"} > (3 * 0.01))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="named/errors"} > (1 * 0.01) and sloe:sli_error:ratio_rate6h{sloe_id="named/errors"} > (1 * 0.01))
        labels:
          sloe_severity: ticket
          team: ml-oncall
        annotations:
          dashboard: https://grafana.example.com/d/chat?var-slo={{ $labels.sloe_slo }}
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          runbook_url: https://runbooks.example.com/chat
          summary: chat / errors is burning its error budget too fast (ticket)
