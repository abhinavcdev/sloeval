# Code generated by sloe from an AISLO spec. DO NOT EDIT.
rule_files:
  - strict.rules.yaml
evaluation_interval: 1m
tests:
  - name: strict/errors fires above the 3d/6h threshold (1x burn rate)
    interval: 1m
    input_series:
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}
        values: 0+9998900x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="openai"}
        values: 0+1100x71
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="sloe_test_other"}
        values: 0+9998900x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="sloe_test_other"}
        values: 0+1100x71
    alert_rule_test:
      - eval_time: 1h10m
        alertname: ChatErrorsErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              sloe_id: strict/errors
              sloe_service: chat
              sloe_severity: ticket
              sloe_slo: errors
              sloe_window: 30d
              team: ml
            exp_annotations:
              description: 'Objective 99.99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
              summary: chat / errors is burning its error budget too fast (ticket)
    promql_expr_test:
      - expr: abs(sloe:sli_error:ratio_rate5m{sloe_id="strict/errors"} - 0.00011) < bool 1e-9
        eval_time: 1h10m
        exp_samples:
          - labels: '{sloe_id="strict/errors", sloe_service="chat", sloe_slo="errors", sloe_window="30d", team="ml"}'
            value: 1
