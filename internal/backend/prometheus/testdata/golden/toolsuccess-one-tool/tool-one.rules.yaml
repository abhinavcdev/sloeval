  - name: sloe:tool-one/search:alerts
    rules:
      - alert: ChatSearchErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="tool-one/search"} > (14.4 * 0.01) and sloe:sli_error:ratio_rate5m{sloe_id="tool-one/search"} > (14.4 * 0.01))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="tool-one/search"} > (6 * 0.01) and sloe:sli_error:ratio_rate30m{sloe_id="tool-one/search"} > (6 * 0.01))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: chat / search is burning its error budget too fast (page)
      - alert: ChatSearchErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="tool-one/search"} > (3 * 0.01) and sloe:sli_error:ratio_rate2h{sloe_id="tool-one/search"} > (3 * 0.01))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="tool-one/search"} > (1 * 0.01) and sloe:sli_error:ratio_rate6h{sloe_id="tool-one/search"} > (1 * 0.01))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: chat / search is burning its error budget too fast (ticket)
