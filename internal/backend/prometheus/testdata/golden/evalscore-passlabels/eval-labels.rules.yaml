  - name: sloe:eval-labels/grounded:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="eval-labels/grounded"}[30d])
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:objective:ratio
        expr: vector(0.97)
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget:ratio
        expr: vector(0.03)
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="eval-labels/grounded"} / 0.03)
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="eval-labels/grounded"} / 0.03
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="eval-labels/grounded"} / 0.03
        labels:
          sloe_id: eval-labels/grounded
          sloe_service: chat
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: eval-labels/grounded
          sloe_objective: "97"
          sloe_service: chat
          sloe_sli_kind: evalScore
          sloe_slo: grounded
          sloe_window: 30d
          team: ml
  - name: sloe:eval-labels/grounded:alerts
    rules:
      - alert: ChatGroundedErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="eval-labels/grounded"} > (14.4 * 0.03) and sloe:sli_error:ratio_rate5m{sloe_id="eval-labels/grounded"} > (14.4 * 0.03))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="eval-labels/grounded"} > (6 * 0.03) and sloe:sli_error:ratio_rate30m{sloe_id="eval-labels/grounded"} > (6 * 0.03))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 97% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: chat / grounded is burning its error budget too fast (page)
      - alert: ChatGroundedErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="eval-labels/grounded"} > (3 * 0.03) and sloe:sli_error:ratio_rate2h{sloe_id="eval-labels/grounded"} > (3 * 0.03))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="eval-labels/grounded"} > (1 * 0.03) and sloe:sli_error:ratio_rate6h{sloe_id="eval-labels/grounded"} > (1 * 0.03))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 97% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: chat / grounded is burning its error budget too fast (ticket)
