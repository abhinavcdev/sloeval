# Code generated by sloe from an AISLO spec. DO NOT EDIT.
groups:
  - name: sloe:quiet/errors:sli
    rules:
      - record: sloe:sli_error:ratio_rate5m
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[5m])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[5m])) > 0)
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:sli_error:ratio_rate1h
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[1h])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[1h])) > 0)
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
  - name: sloe:quiet/errors:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="quiet/errors"}[30d])
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:objective:ratio
        expr: vector(0.99)
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget:ratio
        expr: vector(0.01)
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="quiet/errors"} / 0.01)
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="quiet/errors"} / 0.01
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="quiet/errors"} / 0.01
        labels:
          sloe_id: quiet/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: quiet/errors
          sloe_objective: "99"
          sloe_service: chat
          sloe_sli_kind: errorRatio
          sloe_slo: errors
          sloe_window: 30d
          team: ml
