  - name: sloe:coverage/coverage:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="coverage/coverage"}[30d])
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:objective:ratio
        expr: vector(0.95)
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:error_budget:ratio
        expr: vector(0.05)
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="coverage/coverage"} / 0.05)
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="coverage/coverage"} / 0.05
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="coverage/coverage"} / 0.05
        labels:
          sloe_id: coverage/coverage
          sloe_service: planner
          sloe_slo: coverage
          sloe_window: 30d
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: coverage/coverage
          sloe_objective: "95"
          sloe_service: planner
          sloe_sli_kind: evalCoverage
          sloe_slo: coverage
          sloe_window: 30d
  - name: sloe:coverage/coverage:alerts
    rules:
      - alert: PlannerCoverageErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="coverage/coverage"} > (14.4 * 0.05) and sloe:sli_error:ratio_rate5m{sloe_id="coverage/coverage"} > (14.4 * 0.05))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="coverage/coverage"} > (6 * 0.05) and sloe:sli_error:ratio_rate30m{sloe_id="coverage/coverage"} > (6 * 0.05))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 95% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: planner / coverage is burning its error budget too fast (page)
      - alert: PlannerCoverageErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="coverage/coverage"} > (3 * 0.05) and sloe:sli_error:ratio_rate2h{sloe_id="coverage/coverage"} > (3 * 0.05))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="coverage/coverage"} > (1 * 0.05) and sloe:sli_error:ratio_rate6h{sloe_id="coverage/coverage"} > (1 * 0.05))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 95% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: planner / coverage is burning its error budget too fast (ticket)
