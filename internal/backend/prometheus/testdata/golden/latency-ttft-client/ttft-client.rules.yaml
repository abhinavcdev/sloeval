          (sloe:sli_error:ratio_rate1d{sloe_id="ttft-client/ttft"} > (3 * 0.01) and sloe:sli_error:ratio_rate2h{sloe_id="ttft-client/ttft"} > (3 * 0.01))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="ttft-client/ttft"} > (1 * 0.01) and sloe:sli_error:ratio_rate6h{sloe_id="ttft-client/ttft"} > (1 * 0.01))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: chat / ttft is burning its error budget too fast (ticket)
