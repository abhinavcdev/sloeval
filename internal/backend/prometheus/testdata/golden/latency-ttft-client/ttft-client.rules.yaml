  - name: sloe:ttft-client/ttft:alerts
    rules:
      - alert: ChatTtftErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="ttft-client/ttft"} > (14.4 * 0.01) and sloe:sli_error:ratio_rate5m{sloe_id="ttft-client/ttft"} > (14.4 * 0.01))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="ttft-client/ttft"} > (6 * 0.01) and sloe:sli_error:ratio_rate30m{sloe_id="ttft-client/ttft"} > (6 * 0.01))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: chat / ttft is burning its error budget too fast (page)
      - alert: ChatTtftErrorBudgetBurn
