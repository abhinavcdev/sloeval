          sloe_severity: page
        annotations:
          description: 'Objective 85% over 28d. Burn-rate windows (long/short at rate): 1h/5m at 13.44x, 6h/30m at 5.6x.'
          summary: chat / agreement is burning its error budget too fast (page)
