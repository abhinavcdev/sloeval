  - name: sloe:agent-client/remote-agent:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="agent-client/remote-agent"}[30d])
        labels:
          sloe_id: agent-client/remote-agent
          sloe_service: planner
          sloe_slo: remote-agent
          sloe_window: 30d
      - record: sloe:objective:ratio
        expr: vector(0.99)
        labels:
          sloe_id: agent-client/remote-agent
          sloe_service: planner
          sloe_slo: remote-agent
          sloe_window: 30d
      - record: sloe:error_budget:ratio
        expr: vector(0.01)
        labels:
          sloe_id: agent-client/remote-agent
          sloe_service: planner
          sloe_slo: remote-agent
          sloe_window: 30d
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="agent-client/remote-agent"} / 0.01)
        labels:
          sloe_id: agent-client/remote-agent
          sloe_service: planner
          sloe_slo: remote-agent
          sloe_window: 30d
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="agent-client/remote-agent"} / 0.01
        labels:
          sloe_id: agent-client/remote-agent
          sloe_service: planner
          sloe_slo: remote-agent
          sloe_window: 30d
