  - name: sloe:cost/cost:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="cost/cost"}[30d])
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:objective:ratio
        expr: vector(0.95)
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget:ratio
        expr: vector(0.05)
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="cost/cost"} / 0.05)
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="cost/cost"} / 0.05
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="cost/cost"} / 0.05
        labels:
          sloe_id: cost/cost
          sloe_service: chat
          sloe_slo: cost
          sloe_window: 30d
          team: ml
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: cost/cost
          sloe_objective: "95"
          sloe_service: chat
          sloe_sli_kind: cost
          sloe_slo: cost
          sloe_window: 30d
          team: ml
  - name: sloe:cost/cost:alerts
    rules:
      - alert: ChatCostErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="cost/cost"} > (14.4 * 0.05) and sloe:sli_error:ratio_rate5m{sloe_id="cost/cost"} > (14.4 * 0.05))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="cost/cost"} > (6 * 0.05) and sloe:sli_error:ratio_rate30m{sloe_id="cost/cost"} > (6 * 0.05))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 95% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: chat / cost is burning its error budget too fast (page)
      - alert: ChatCostErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="cost/cost"} > (3 * 0.05) and sloe:sli_error:ratio_rate2h{sloe_id="cost/cost"} > (3 * 0.05))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="cost/cost"} > (1 * 0.05) and sloe:sli_error:ratio_rate6h{sloe_id="cost/cost"} > (1 * 0.05))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 95% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: chat / cost is burning its error budget too fast (ticket)
