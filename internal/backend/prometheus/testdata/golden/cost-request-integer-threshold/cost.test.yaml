# Code generated by sloe from an AISLO spec. DO NOT EDIT.
rule_files:
  - cost.rules.yaml
evaluation_interval: 1m
tests:
  - name: cost/cost fires above the 3d/6h threshold (1x burn rate)
    interval: 1m
    input_series:
      - series: sloe_gen_ai_request_cost_usd_count{gen_ai_provider_name="openai"}
        values: 0+20000x71
      - series: sloe_gen_ai_request_cost_usd_bucket{gen_ai_provider_name="openai", le="1"}
        values: 0+18900x71
      - series: sloe_gen_ai_request_cost_usd_bucket{gen_ai_provider_name="openai", le="+Inf"}
        values: 0+20000x71
      - series: sloe_gen_ai_request_cost_usd_count{gen_ai_provider_name="sloe_test_other"}
        values: 0+20000x71
      - series: sloe_gen_ai_request_cost_usd_bucket{gen_ai_provider_name="sloe_test_other", le="1"}
        values: 0+18900x71
      - series: sloe_gen_ai_request_cost_usd_bucket{gen_ai_provider_name="sloe_test_other", le="+Inf"}
        values: 0+20000x71
    alert_rule_test:
      - eval_time: 1h10m
        alertname: ChatCostErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              sloe_id: cost/cost
              sloe_service: chat
              sloe_severity: ticket
              sloe_slo: cost
              sloe_window: 30d
              team: ml
            exp_annotations:
              description: 'Objective 95% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
              summary: chat / cost is burning its error budget too fast (ticket)
    promql_expr_test:
      - expr: abs(sloe:sli_error:ratio_rate5m{sloe_id="cost/cost"} - 0.055) < bool 1e-9
        eval_time: 1h10m
        exp_samples:
          - labels: '{sloe_id="cost/cost", sloe_service="chat", sloe_slo="cost", sloe_window="30d", team="ml"}'
