  - name: sloe:agent-errors/errors:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="agent-errors/errors"}[30d])
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:objective:ratio
        expr: vector(0.995)
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:error_budget:ratio
        expr: vector(0.005)
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="agent-errors/errors"} / 0.005)
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="agent-errors/errors"} / 0.005
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="agent-errors/errors"} / 0.005
        labels:
          sloe_id: agent-errors/errors
          sloe_service: planner
          sloe_slo: errors
          sloe_window: 30d
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: agent-errors/errors
          sloe_objective: "99.5"
          sloe_service: planner
          sloe_sli_kind: errorRatio
          sloe_slo: errors
          sloe_window: 30d
  - name: sloe:agent-errors/errors:alerts
    rules:
      - alert: PlannerErrorsErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1h{sloe_id="agent-errors/errors"} > (14.4 * 0.005) and sloe:sli_error:ratio_rate5m{sloe_id="agent-errors/errors"} > (14.4 * 0.005))
          or
          (sloe:sli_error:ratio_rate6h{sloe_id="agent-errors/errors"} > (6 * 0.005) and sloe:sli_error:ratio_rate30m{sloe_id="agent-errors/errors"} > (6 * 0.005))
        labels:
          sloe_severity: page
        annotations:
          description: 'Objective 99.5% over 30d. Burn-rate windows (long/short at rate): 1h/5m at 14.4x, 6h/30m at 6x.'
          summary: planner / errors is burning its error budget too fast (page)
      - alert: PlannerErrorsErrorBudgetBurn
        expr: |-
          (sloe:sli_error:ratio_rate1d{sloe_id="agent-errors/errors"} > (3 * 0.005) and sloe:sli_error:ratio_rate2h{sloe_id="agent-errors/errors"} > (3 * 0.005))
          or
          (sloe:sli_error:ratio_rate3d{sloe_id="agent-errors/errors"} > (1 * 0.005) and sloe:sli_error:ratio_rate6h{sloe_id="agent-errors/errors"} > (1 * 0.005))
        labels:
          sloe_severity: ticket
        annotations:
          description: 'Objective 99.5% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 3x, 3d/6h at 1x.'
          summary: planner / errors is burning its error budget too fast (ticket)
