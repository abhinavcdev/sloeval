# Code generated by sloe from an AISLO spec. DO NOT EDIT.
rule_files:
  - ml-platform.ticket-only.rules.yaml
evaluation_interval: 1m
tests:
  - name: ml-platform/ticket-only/errors fires above the 1d/2h threshold (2x burn rate)
    interval: 1m
    input_series:
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}
        values: 0+97800x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="openai"}
        values: 0+2200x71
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="sloe_test_other"}
        values: 0+97800x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="sloe_test_other"}
        values: 0+2200x71
    alert_rule_test:
      - eval_time: 1h10m
        alertname: ChatErrorsErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              sloe_id: ml-platform/ticket-only/errors
              sloe_service: chat
              sloe_severity: ticket
              sloe_slo: errors
              sloe_window: 30d
              team: ml
            exp_annotations:
              description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 2x.'
              summary: chat / errors is burning its error budget too fast (ticket)
    promql_expr_test:
      - expr: abs(sloe:sli_error:ratio_rate5m{sloe_id="ml-platform/ticket-only/errors"} - 0.022) < bool 1e-9
        eval_time: 1h10m
        exp_samples:
          - labels: '{sloe_id="ml-platform/ticket-only/errors", sloe_service="chat", sloe_slo="errors", sloe_window="30d", team="ml"}'
            value: 1
  - name: ml-platform/ticket-only/errors stays quiet below the lowest burn-rate threshold
    interval: 1m
    input_series:
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}
        values: 0+98200x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="openai"}
        values: 0+1800x71
      - series: gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="sloe_test_other"}
        values: 0+98200x71
      - series: gen_ai_client_inference_duration_seconds_count{error_type="sloe_test_error", gen_ai_provider_name="sloe_test_other"}
        values: 0+1800x71
    alert_rule_test:
      - eval_time: 1h10m
        alertname: ChatErrorsErrorBudgetBurn
        exp_alerts: []
  - name: ml-platform/ticket-only/errors does not alert without traffic
    interval: 1m
    input_series:
      - series: sloe_test_unrelated_total
        values: 0+1x20
    alert_rule_test:
      - eval_time: 10m
        alertname: ChatErrorsErrorBudgetBurn
        exp_alerts: []
