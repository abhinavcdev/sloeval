# Code generated by sloe from an AISLO spec. DO NOT EDIT.
groups:
  - name: sloe:ml-platform/ticket-only/errors:sli
    rules:
      - record: sloe:sli_error:ratio_rate5m
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[5m])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[5m])) > 0)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:sli_error:ratio_rate1h
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[1h])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[1h])) > 0)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:sli_error:ratio_rate2h
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[2h])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[2h])) > 0)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
