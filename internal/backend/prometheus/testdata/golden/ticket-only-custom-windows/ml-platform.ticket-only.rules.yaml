      - record: sloe:sli_error:ratio_rate1d
        expr: |-
          ((sum(rate(gen_ai_client_inference_duration_seconds_count{error_type!="", gen_ai_provider_name="openai"}[1d])) or vector(0)))
          /
          (sum(rate(gen_ai_client_inference_duration_seconds_count{gen_ai_provider_name="openai"}[1d])) > 0)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
  - name: sloe:ml-platform/ticket-only/errors:meta
    interval: 1m
    rules:
      - record: sloe:sli_error:ratio_rate30d
        expr: avg_over_time(sloe:sli_error:ratio_rate5m{sloe_id="ml-platform/ticket-only/errors"}[30d])
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:objective:ratio
        expr: vector(0.99)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget:ratio
        expr: vector(0.01)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:error_budget_remaining:ratio
        expr: 1 - (sloe:sli_error:ratio_rate30d{sloe_id="ml-platform/ticket-only/errors"} / 0.01)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate5m
        expr: sloe:sli_error:ratio_rate5m{sloe_id="ml-platform/ticket-only/errors"} / 0.01
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:burn_rate:ratio_rate1h
        expr: sloe:sli_error:ratio_rate1h{sloe_id="ml-platform/ticket-only/errors"} / 0.01
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_service: chat
          sloe_slo: errors
          sloe_window: 30d
          team: ml
      - record: sloe:slo_info
        expr: vector(1)
        labels:
          sloe_id: ml-platform/ticket-only/errors
          sloe_objective: "99"
          sloe_service: chat
          sloe_sli_kind: errorRatio
          sloe_slo: errors
          sloe_window: 30d
          team: ml
  - name: sloe:ml-platform/ticket-only/errors:alerts
    rules:
      - alert: ChatErrorsErrorBudgetBurn
        expr: (sloe:sli_error:ratio_rate1d{sloe_id="ml-platform/ticket-only/errors"} > (2 * 0.01) and sloe:sli_error:ratio_rate2h{sloe_id="ml-platform/ticket-only/errors"} > (2 * 0.01))
        labels:
          severity: warning
          sloe_severity: ticket
        annotations:
          description: 'Objective 99% over 30d. Burn-rate windows (long/short at rate): 1d/2h at 2x.'
          summary: chat / errors is burning its error budget too fast (ticket)
