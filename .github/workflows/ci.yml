name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race -count=1 ./...
      - name: golden files are up to date
        run: |
          UPDATE_GOLDEN=1 go test ./... >/dev/null
          git status --porcelain
          test -z "$(git status --porcelain)"

  promtool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./hack/install-promtool.sh 3.5.0 .tools
      - run: make promtool-check PROMTOOL=.tools/promtool
